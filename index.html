<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>thing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#07080f; --surface:#0e1120; --border:#1a2540;
      --accent:#4affa4; --danger:#ff4a6b; --warn:#ffc94a;
      --blue:#4a9eff; --text:#c8d4f0; --muted:#4a5580;
      --font-hud:'Share Tech Mono',monospace;
      --font-title:'Orbitron',monospace; --r:10px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--font-hud);
         height:100dvh;overflow:hidden;display:flex;flex-direction:column}
    .screen{display:none;width:100%;height:100dvh;
            align-items:center;justify-content:center;flex-direction:column}
    .screen.active{display:flex}

    .panel{background:var(--surface);border:1px solid var(--border);
           border-radius:16px;padding:2rem;width:min(420px,94vw)}
    h1{font-family:var(--font-title);font-size:clamp(1.6rem,5vw,2.4rem);
       color:var(--accent);letter-spacing:.05em;
       text-shadow:0 0 20px rgba(74,255,164,0.4);margin-bottom:.25rem}
    .sub{color:var(--muted);font-size:.75rem;margin-bottom:1.5rem;letter-spacing:.1em}
    input,select{width:100%;padding:.7rem 1rem;background:var(--bg);
      border:1px solid var(--border);color:var(--text);border-radius:var(--r);
      font-family:var(--font-hud);font-size:.9rem;margin-bottom:.6rem;
      outline:none;transition:border-color .2s}
    input:focus,select:focus{border-color:var(--accent)}
    .btn{display:block;width:100%;padding:.75rem;background:var(--accent);
         color:#07080f;border:none;border-radius:var(--r);
         font-family:var(--font-title);font-size:.85rem;font-weight:800;
         letter-spacing:.08em;cursor:pointer;transition:opacity .15s,transform .1s}
    .btn:hover{opacity:.85}.btn:active{transform:scale(.97)}
    .btn.danger{background:var(--danger);color:#fff}
    .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
    .btn.hidden{display:none!important}
    .divider{height:1px;background:var(--border);margin:1rem 0}
    #player-list{list-style:none;margin-bottom:1rem}
    #player-list li{padding:.4rem .7rem;background:var(--bg);border-radius:6px;
                    margin-bottom:.4rem;font-size:.85rem;border:1px solid var(--border)}

    /* Game */
    #screen-game{flex-direction:column;padding:0;position:relative}
    #hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;
         gap:.5rem;padding:.4rem .6rem;background:rgba(7,8,15,0.88);
         backdrop-filter:blur(6px);border-bottom:1px solid var(--border);
         z-index:20;flex-wrap:wrap}
    .hud-pill{padding:.2rem .6rem;border-radius:999px;font-size:.7rem;
              font-family:var(--font-hud);border:1px solid currentColor}
    .hud-role-crew    {color:var(--blue);  background:rgba(74,158,255,0.1)}
    .hud-role-impostor{color:var(--danger);background:rgba(255,74,107,0.1)}
    .hud-role-jester  {color:var(--warn);  background:rgba(255,201,74,0.1)}
    .hud-role-dead    {color:var(--muted); background:rgba(74,85,128,0.1)}
    .hud-spacer{flex:1}
    #game-canvas{flex:1;width:100%;display:block;margin-top:38px}
    #action-bar{position:absolute;bottom:0;left:0;right:0;display:flex;gap:.5rem;
                padding:.5rem .6rem;background:rgba(7,8,15,0.88);
                backdrop-filter:blur(6px);border-top:1px solid var(--border);z-index:20}
    #action-bar .btn{flex:1;padding:.6rem .4rem;font-size:.7rem}
    #joystick-wrap{position:absolute;bottom:80px;left:24px;width:100px;
                   height:100px;z-index:25;display:none}
    #joystick{width:100%;height:100%;background:rgba(255,255,255,0.06);
              border:2px solid rgba(255,255,255,0.15);border-radius:50%;
              display:flex;align-items:center;justify-content:center}
    #joystick-knob{width:36px;height:36px;background:rgba(74,255,164,0.6);
                   border-radius:50%;pointer-events:none}
    #room-label{position:absolute;top:46px;left:50%;transform:translateX(-50%);
                background:rgba(7,8,15,0.9);border:1px solid var(--accent);
                color:var(--accent);padding:.2rem .8rem;border-radius:999px;
                font-size:.7rem;letter-spacing:.1em;z-index:21;
                pointer-events:none;opacity:0;transition:opacity .3s}
    #room-label.visible{opacity:1}

    /* Kill flash */
    #kill-flash{position:fixed;inset:0;background:rgba(255,74,107,0);
                pointer-events:none;z-index:200;transition:background .1s}
    #kill-flash.flash{background:rgba(255,74,107,0.25)}

    /* Task modal */
    #task-modal{position:fixed;inset:0;background:rgba(0,0,0,0.75);
                backdrop-filter:blur(4px);align-items:center;
                justify-content:center;z-index:50;display:none}
    #task-modal.open{display:flex}
    .task-box{background:var(--surface);border:1px solid var(--border);
              border-radius:16px;padding:1.5rem;width:min(460px,95vw)}
    .task-box h3{font-family:var(--font-title);color:var(--accent);
                 margin-bottom:1rem;font-size:.9rem}

    /* Meeting */
    #meeting-overlay{position:fixed;inset:0;background:var(--bg);z-index:100;
                     padding:1.5rem;display:none;flex-direction:column}
    #meeting-overlay.active{display:flex}
    #meeting-overlay h2{font-family:var(--font-title);color:var(--danger);
                        font-size:1.2rem;margin-bottom:.5rem}
    #vote-list{display:flex;flex-direction:column;gap:.5rem;margin-top:.75rem;
               overflow-y:auto;flex:1}
    .vote-btn{padding:.7rem 1rem;background:var(--surface);
              border:1px solid var(--border);border-radius:var(--r);
              color:var(--text);font-family:var(--font-hud);font-size:.85rem;
              cursor:pointer;text-align:left;transition:border-color .2s;
              display:flex;align-items:center;gap:.75rem}
    .vote-btn:hover{border-color:var(--danger);color:var(--danger)}
    .vote-btn:disabled{opacity:.4;cursor:default}
    .vote-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
    #timer-bar{height:4px;background:var(--border);border-radius:2px;margin:.6rem 0;overflow:hidden}
    #timer-fill{height:100%;background:var(--accent);transition:width 1s linear}
    #timer-label{font-size:.72rem;color:var(--muted)}
    #vote-result{margin-top:.75rem;padding:1rem;background:var(--surface);
                 border-radius:var(--r);border:1px solid var(--border);
                 font-size:.85rem;display:none}

    /* End */
    #end-title{font-family:var(--font-title);font-size:2rem;margin-bottom:.5rem}

    body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:999;
      background:repeating-linear-gradient(0deg,transparent,transparent 2px,
        rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px)}
  </style>
</head>
<body>
<div id="kill-flash"></div>

<!-- LOBBY -->
<div id="screen-lobby" class="screen active">
  <div class="panel">
    <h1>thing<span style="color:var(--blue)">y</span></h1>
    <p class="sub">▸ LEARN ◆ DECEIVE ◆ SURVIVE ◀</p>
    <input id="player-name" type="text" placeholder="Callsign (your name)" maxlength="16" autocomplete="off"/>
    <input id="match-id"    type="text" placeholder="Match code — blank to create" maxlength="8" autocomplete="off"/>
    <div id="host-settings">
      <div class="divider"></div>
      <select id="setting-chat">
        <option value="chat">💬 In-game chat during meetings</option>
        <option value="class">🏫 Discuss aloud in class</option>
      </select>
      <input id="setting-discuss"    type="number" placeholder="Discussion time (sec)" value="120"/>
      <input id="setting-vote"       type="number" placeholder="Voting time (sec)" value="60"/>
      <input id="setting-zone-calls" type="number" placeholder="Meeting-zone calls per player" value="1"/>
    </div>
    <div class="divider"></div>
    <button class="btn" id="btn-join">LAUNCH</button>
  </div>
</div>

<!-- WAITING -->
<div id="screen-waiting" class="screen">
  <div class="panel">
    <h1>STANDING<br>BY</h1>
    <p class="sub">MATCH CODE: <strong id="waiting-code" style="color:var(--accent)"></strong></p>
    <div class="divider"></div>
    <ul id="player-list"></ul>
    <button class="btn hidden" id="btn-start">START GAME</button>
  </div>
</div>

<!-- GAME -->
<div id="screen-game" class="screen">
  <div id="hud">
    <span id="hud-role"   class="hud-pill hud-role-crew">CREW</span>
    <span id="hud-shield" class="hud-pill" style="color:var(--muted);border-color:var(--muted)">NO SHIELD</span>
    <span class="hud-spacer"></span>
    <span id="hud-kill-status" style="font-size:.7rem;color:var(--muted)"></span>
    <span id="hud-room" style="font-size:.7rem;color:var(--muted);margin-left:.5rem">—</span>
  </div>
  <div id="room-label"></div>
  <canvas id="game-canvas"></canvas>
  <div id="joystick-wrap">
    <div id="joystick"><div id="joystick-knob"></div></div>
  </div>
  <div id="action-bar">
    <button class="btn ghost hidden" id="btn-task">⬡ TASK</button>
    <button class="btn danger hidden" id="btn-kill">✕ KILL</button>
    <button class="btn hidden"        id="btn-swap">⇄ SWAP</button>
    <button class="btn ghost"         id="btn-report">⚑ REPORT</button>
    <button class="btn ghost hidden"  id="btn-meeting">◈ MEETING</button>
  </div>
</div>

<!-- END -->
<div id="screen-end" class="screen">
  <div class="panel" style="text-align:center">
    <h1 id="end-title">GAME OVER</h1>
    <p id="end-body" style="color:var(--muted);margin:1rem 0;font-size:.85rem"></p>
    <button class="btn" onclick="location.reload()">BACK TO LOBBY</button>
  </div>
</div>

<!-- TASK MODAL -->
<div id="task-modal">
  <div class="task-box">
    <h3>⬡ TASK STATION</h3>
    <div id="task-content"></div>
    <div class="divider"></div>
    <button class="btn ghost" id="btn-close-task">CLOSE</button>
  </div>
</div>

<!-- MEETING OVERLAY -->
<div id="meeting-overlay">
  <h2 id="meeting-title">🚨 EMERGENCY MEETING</h2>
  <p id="meeting-reason" style="color:var(--muted);font-size:.8rem;margin-bottom:.25rem"></p>
  <div id="timer-bar"><div id="timer-fill" style="width:100%"></div></div>
  <p id="timer-label">DISCUSSION</p>
  <div id="chat-wrap" style="display:none;flex-direction:column;gap:.4rem;margin-bottom:.5rem">
    <div id="chat-box" style="background:var(--bg);border:1px solid var(--border);
         border-radius:var(--r);padding:.75rem;height:120px;overflow-y:auto;font-size:.8rem"></div>
    <div style="display:flex;gap:.4rem">
      <input id="chat-input" type="text" placeholder="Say something…" maxlength="120" style="margin:0;flex:1"/>
      <button class="btn" id="btn-chat-send" style="width:auto;padding:.4rem .8rem;font-size:.75rem">SEND</button>
    </div>
  </div>
  <div id="vote-list"></div>
  <div id="vote-result"></div>
</div>

<script type="module">
import { GAME_CONFIG }                    from "./config.js";
import { createMatch, joinMatch,
         onPlayersChange, onPhaseChange,
         assignRoles, setPhase,
         callMeeting, castVote,
         applyKill, onMeetingChange,
         setKillReady,
         getMatchSettings, getPlayerData,
         sendChatMessage, onChatMessage }  from "./realtime.js";
import { Impostor, Jester, Crew }         from "./roles.js";
import { World, randomColor }             from "./world.js";
import { SwipeTask, ConnectorTask,
         FruitNinjaTask }                 from "./tasks.js";

const $ = id => document.getElementById(id);
const show = id => {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
};

let matchId, localPlayer, world;
let allPlayers = {}, settings = {}, isHost = false;
let meetingTimerInterval = null;
let killReady = false;
let hasVoted  = false;
let chatUnsubscribe = null;

// ── Touch detection ──────────────────────────────────────────
if (window.matchMedia("(pointer:coarse)").matches)
  $("joystick-wrap").style.display = "block";

// ── Listen to role-based events from roles.js ────────────────
document.addEventListener("game:killReady", () => {
  $("hud-kill-status").textContent = "🔪 KILL READY";
  $("hud-kill-status").style.color = "var(--danger)";
});
document.addEventListener("game:killProgress", e => {
  const { progress, needed } = e.detail;
  $("hud-kill-status").textContent = `🔪 SQ ${progress}/${needed}`;
  $("hud-kill-status").style.color = "var(--muted)";
});
document.addEventListener("game:shieldGranted", () => {
  $("hud-shield").textContent      = "🛡 SHIELDED";
  $("hud-shield").style.color       = "var(--accent)";
  $("hud-shield").style.borderColor = "var(--accent)";
});
document.addEventListener("game:jesterProgress", e => {
  const { progress, needed } = e.detail;
  flashHud(`⇄ Swap charge: ${progress}/${needed}`, "info");
});
document.addEventListener("game:jesterSwapReady", e => {
  const { impostorPos } = e.detail;
  flashHud(`⇄ Swap ready! Impostor nearby (${Math.round(impostorPos?.x ?? 0)},${Math.round(impostorPos?.y ?? 0)})`, "warn");
});

// ── Lobby ────────────────────────────────────────────────────
$("match-id").addEventListener("input", () => {
  $("host-settings").style.display = $("match-id").value ? "none" : "block";
});

$("btn-join").addEventListener("click", async () => {
  const name = $("player-name").value.trim();
  if (!name) { $("player-name").focus(); return; }

  isHost      = !$("match-id").value.trim();
  matchId     = $("match-id").value.trim() ||
                Math.random().toString(36).slice(2,7).toUpperCase();
  localPlayer = { id: crypto.randomUUID(), name, color: randomColor() };

  if (isHost) {
    settings = {
      useChat:        $("setting-chat").value,
      discussionTime: +$("setting-discuss").value  || 120,
      votingTime:     +$("setting-vote").value      || 60,
      meetingCalls:   +$("setting-zone-calls").value || 1,
    };
    await createMatch(matchId, localPlayer.id, settings);
    $("btn-start").classList.remove("hidden");
  }

  await joinMatch(matchId, localPlayer);
  $("waiting-code").textContent = matchId;
  show("screen-waiting");

  onPlayersChange(matchId, snap => {
    allPlayers = snap ?? {};
    $("player-list").innerHTML = Object.values(allPlayers)
      .map(p => `<li style="border-left:3px solid ${p.color}">${p.name}</li>`).join("");
  });

  // ── Non-host: watch for game start ──────────────────────────
  if (!isHost) {
    onPhaseChange(matchId, async phase => {
      if (phase === "playing" && !world) {
        // BUG FIX: fetch settings from Firebase for non-host players
        settings = await getMatchSettings(matchId);

        // BUG FIX: read role — wait for player data if not yet loaded
        let me = allPlayers[localPlayer.id];
        if (!me || !me.role) {
          me = await getPlayerData(matchId, localPlayer.id);
        }
        localPlayer.role = me?.role ?? "crew";
        launchGame();
      }
    });
  }
});

// ── Start game (host) ────────────────────────────────────────
$("btn-start").addEventListener("click", async () => {
  const ids = Object.keys(allPlayers);
  if (ids.length < 3) { alert("Need at least 3 players"); return; }
  const shuffled = [...ids].sort(() => Math.random() - 0.5);
  const roleMap  = {};
  shuffled.forEach((id, i) =>
    roleMap[id] = i === 0 ? "impostor" : i === 1 ? "jester" : "crew");
  await assignRoles(matchId, roleMap);
  await setPhase(matchId, "playing");
  localPlayer.role = roleMap[localPlayer.id];
  launchGame();
});

// ── Launch game ──────────────────────────────────────────────
function launchGame() {
  show("screen-game");
  const canvas = $("game-canvas");

  const resize = () => {
    canvas.width  = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
  };
  setTimeout(resize, 50);
  window.addEventListener("resize", resize);

  world = new World(canvas, matchId, localPlayer);

  world.onEnterRoom = room => {
    const lbl = $("room-label");
    $("hud-room").textContent = room?.label ?? "—";
    if (room) {
      lbl.textContent = room.label.toUpperCase();
      lbl.classList.add("visible");
      setTimeout(() => lbl.classList.remove("visible"), 2000);
    }
    $("btn-task").classList.toggle("hidden", !room?.taskZone);
    $("btn-meeting").classList.toggle("hidden", !room?.meetingZone);
  };

  setTimeout(() => world.start(), 60);

  // HUD role pill
  const role = localPlayer.role ?? "crew";
  const pill = $("hud-role");
  pill.textContent = role.toUpperCase();
  pill.className   = `hud-pill hud-role-${role}`;

  // Show role-specific buttons
  if (role === "impostor") {
    $("btn-kill").classList.remove("hidden");
    $("hud-kill-status").textContent = "🔪 NEED SQ";
  }
  if (role === "jester") $("btn-swap").classList.remove("hidden");

  // Watch phase for meeting overlay
  onPhaseChange(matchId, phase => {
    if (phase === "meeting") openMeeting();
    else                     closeMeeting();
    checkWinConditions(allPlayers);
  });

  // Watch players
  onPlayersChange(matchId, snap => {
    allPlayers = snap ?? {};
    const me = allPlayers[localPlayer.id];
    if (me && role === "impostor") {
      killReady = me.killReady ?? false;
      $("hud-kill-status").textContent = killReady ? "🔪 KILL READY" : "🔪 NEED SQ";
      $("hud-kill-status").style.color = killReady ? "var(--danger)" : "var(--muted)";
    }
    // Update shield HUD from Firebase (e.g. ghost shield given by dead player)
    if (me) {
      if (me.shield) {
        $("hud-shield").textContent      = "🛡 SHIELDED";
        $("hud-shield").style.color       = "var(--accent)";
        $("hud-shield").style.borderColor = "var(--accent)";
      } else {
        $("hud-shield").textContent      = "NO SHIELD";
        $("hud-shield").style.color       = "var(--muted)";
        $("hud-shield").style.borderColor = "var(--muted)";
      }
    }
    checkWinConditions(allPlayers);
  });

  // BUG FIX: onMeetingChange with matchId must be set up INSIDE launchGame,
  // after matchId is defined — not at module level where matchId is undefined.
  onMeetingChange(matchId, mtg => {
    window._latestMeeting = mtg;
    if (!mtg) return;
    if (settings.useChat === "chat") syncChat(mtg);
  });
}

// ── Kill ─────────────────────────────────────────────────────
$("btn-kill").addEventListener("click", async () => {
  if (localPlayer.role !== "impostor") return;
  if (!killReady) {
    flashHud("Complete an SQ first to preload a kill!");
    return;
  }
  const target = world?.findNearest(50);
  if (!target) {
    flashHud("No one in range!");
    return;
  }

  // Shield check — impostor is notified silently, crew is NOT told
  if (target.shield) {
    const blocked = Math.random() < target.shield.chance;
    if (blocked) {
      // BUG FIX: was calling Impostor.onSqCorrect() which incremented the
      // kill counter instead of resetting it.  Directly reset kill-ready.
      flashHud("Kill blocked by shield!", "warn");
      killReady = false;
      await Impostor.resetKill(matchId, localPlayer.id);
      $("hud-kill-status").textContent = "🔪 NEED SQ";
      $("hud-kill-status").style.color  = "var(--muted)";
      return;
    }
  }

  // Kill lands
  await applyKill(matchId, target.id);
  killReady = false;
  await setKillReady(matchId, localPlayer.id, false);

  const f = $("kill-flash");
  f.classList.add("flash");
  setTimeout(() => f.classList.remove("flash"), 300);
  $("hud-kill-status").textContent = "🔪 NEED SQ";
  $("hud-kill-status").style.color  = "var(--muted)";
});

// ── Meeting ───────────────────────────────────────────────────

// Report corpse button
$("btn-report").addEventListener("click", async () => {
  if (!localPlayer) return;
  await callMeeting(matchId, localPlayer.id, "corpse");
  await setPhase(matchId, "meeting");
});

// Meeting zone button
$("btn-meeting").addEventListener("click", async () => {
  const me = allPlayers[localPlayer.id];
  if ((me?.meetingCallsLeft ?? 1) <= 0) { flashHud("No meeting calls left!"); return; }
  await callMeeting(matchId, localPlayer.id, "zone");
  await setPhase(matchId, "meeting");
});

function openMeeting() {
  hasVoted = false;
  $("meeting-overlay").classList.add("active");
  $("vote-result").style.display = "none";
  $("vote-result").textContent   = "";

  // Chat
  const useChat = settings.useChat === "chat";
  $("chat-wrap").style.display = useChat ? "flex" : "none";

  // Build vote list
  buildVoteList();

  // Timer: discussion phase
  startMeetingTimer(
    settings.discussionTime ?? 120,
    "DISCUSSION",
    () => startVotingPhase()
  );
}

function buildVoteList() {
  const alive = Object.entries(allPlayers).filter(([,p]) => p.alive);
  $("vote-list").innerHTML = alive.map(([id, p]) => `
    <button class="vote-btn" data-id="${id}" ${id === localPlayer.id ? "disabled" : ""}>
      <span class="vote-dot" style="background:${p.color}"></span>
      ${p.name}${id === localPlayer.id ? " (you)" : ""}
    </button>
  `).join("") + `
    <button class="vote-btn" data-id="skip" style="color:var(--muted)">
      ⊘ Skip vote
    </button>
  `;
  $("vote-list").querySelectorAll(".vote-btn[data-id]").forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener("click", async () => {
      if (hasVoted) return;
      hasVoted = true;
      $("vote-list").querySelectorAll(".vote-btn").forEach(b => b.disabled = true);
      btn.style.borderColor = "var(--accent)";
      await castVote(matchId, localPlayer.id, btn.dataset.id);
    });
  });
}

function startVotingPhase() {
  $("timer-label").textContent = "VOTING";
  $("timer-fill").style.background = "var(--danger)";
  startMeetingTimer(
    settings.votingTime ?? 60,
    "VOTING",
    () => tallyVotes()
  );
}

async function tallyVotes() {
  // Allow last-second votes to arrive
  await new Promise(r => setTimeout(r, 1500));

  const votes   = window._latestMeeting?.votes ?? {};
  const tally   = {};
  for (const v of Object.values(votes)) tally[v] = (tally[v] ?? 0) + 1;

  const sorted   = Object.entries(tally).sort((a,b) => b[1] - a[1]);
  const topId    = sorted[0]?.[0];
  const topVotes = sorted[0]?.[1] ?? 0;
  const tied     = sorted.length > 1 && sorted[1][1] === topVotes;

  const result = $("vote-result");
  result.style.display = "block";

  if (!topId || topId === "skip" || tied) {
    result.textContent = tied
      ? "🤝 Tied vote — no one ejected."
      : "⊘ No votes — no one ejected.";
    result.style.color = "var(--muted)";
  } else {
    const ejected = allPlayers[topId];
    result.innerHTML = `
      <strong style="color:var(--danger)">${ejected?.name ?? "?"}</strong>
      was ejected with ${topVotes} vote${topVotes>1?"s":""}.<br>
      <span style="color:var(--muted);font-size:.8rem">They were… 
        <strong>${ejected?.role ?? "?"}</strong></span>
    `;
    await applyKill(matchId, topId);
    checkWinConditions({ ...allPlayers, [topId]: { ...allPlayers[topId], alive: false }});
  }

  // Resume game after 4 seconds
  setTimeout(async () => {
    await setPhase(matchId, "playing");
  }, 4000);
}

function closeMeeting() {
  $("meeting-overlay").classList.remove("active");
  clearInterval(meetingTimerInterval);
  if (chatUnsubscribe) { chatUnsubscribe(); chatUnsubscribe = null; }
}

function startMeetingTimer(secs, label, onDone) {
  clearInterval(meetingTimerInterval);
  let remaining = secs;
  $("timer-label").textContent = label;
  $("timer-fill").style.width  = "100%";
  meetingTimerInterval = setInterval(() => {
    remaining--;
    $("timer-fill").style.width = `${(remaining/secs)*100}%`;
    $("timer-label").textContent = `${label} — ${remaining}s`;
    if (remaining <= 0) { clearInterval(meetingTimerInterval); onDone(); }
  }, 1000);
}

// ── Chat ─────────────────────────────────────────────────────
$("btn-chat-send")?.addEventListener("click", sendChat);
$("chat-input")?.addEventListener("keydown", e => { if (e.key === "Enter") sendChat(); });

async function sendChat() {
  const msg = $("chat-input")?.value.trim();
  if (!msg || !matchId) return;
  $("chat-input").value = "";
  // BUG FIX: actually push message to Firebase using the realtime helper
  await sendChatMessage(
    matchId,
    localPlayer.id,
    localPlayer.name,
    localPlayer.color,
    msg
  );
}

// BUG FIX: syncChat now subscribes to Firebase chat using onChatMessage
// and renders live messages — previously it was a no-op stub.
function syncChat(_mtg) {
  // Unsubscribe any previous listener
  if (chatUnsubscribe) { chatUnsubscribe(); chatUnsubscribe = null; }

  chatUnsubscribe = onChatMessage(matchId, msgs => {
    const box = $("chat-box");
    if (!box) return;
    box.innerHTML = msgs.map(m =>
      `<div style="margin-bottom:.2rem">
         <strong style="color:${m.color}">${_escHtml(m.playerName)}:</strong>
         ${_escHtml(m.text)}
       </div>`
    ).join("");
    box.scrollTop = box.scrollHeight;
  });
}

function _escHtml(str) {
  return String(str)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ── Swap (jester) ────────────────────────────────────────────
$("btn-swap").addEventListener("click", () => {
  const impPos = world?.getImpostorPosition();
  if (!impPos) { flashHud("Can't locate impostor"); return; }
  const confirmed = confirm(`Swap to impostor's position? Costs ${GAME_CONFIG.jesterSwapCostSq} SQs.`);
  if (confirmed) {
    const imp = Object.values(allPlayers).find(p => p.role === "impostor");
    if (imp) Jester.triggerSwap(matchId, localPlayer.id, imp.id);
  }
});

// ── Tasks ────────────────────────────────────────────────────
$("btn-task").addEventListener("click", () => {
  const room = world?.getLocalRoom();
  if (!room?.taskZone) return;
  openTask(room);
});
$("btn-close-task").addEventListener("click", () => $("task-modal").classList.remove("open"));

function openTask(room) {
  $("task-modal").classList.add("open");
  $("task-content").innerHTML = "";
  const type = room.id === "electrical" ? "connector"
             : room.id === "weapons"    ? "ninja"
             : "swipe";

  const onDone = async (score, total, pass) => {
    $("task-modal").classList.remove("open");
    if (pass) {
      await Crew.onTaskComplete(matchId, localPlayer.id);
      // Shield HUD is updated by the "game:shieldGranted" event from roles.js
    }
    // Impostor: completing a task also preloads a kill
    if (localPlayer.role === "impostor" && pass) {
      await Impostor.onSqCorrect(matchId, localPlayer.id);
    }
  };

  if (type === "swipe") {
    const t = new SwipeTask("task-content");
    t.onComplete = (s,total) => onDone(s,total, s >= Math.ceil(total*0.6));
    t.init();
  } else if (type === "connector") {
    const t = new ConnectorTask("task-content");
    t.onComplete = (s,total) => onDone(s,total, s >= 1);
    t.init();
  } else {
    const cvs = document.createElement("canvas");
    cvs.id = "ninja-canvas"; cvs.width = 360; cvs.height = 220;
    $("task-content").appendChild(cvs);
    const t = new FruitNinjaTask("ninja-canvas");
    t.onComplete = (s,total) => { onDone(s,total, s >= Math.ceil(total*0.5)); t.destroy(); };
    t.init();
  }
}

// ── Win conditions ────────────────────────────────────────────
let gameOver = false;
function checkWinConditions(players) {
  if (gameOver) return;
  const list       = Object.values(players);
  const alive      = list.filter(p => p.alive);
  const imps       = alive.filter(p => p.role === "impostor");
  const crew       = alive.filter(p => p.role === "crew");
  const jesterDead = list.find(p => p.role === "jester" && !p.alive);
  if (imps.length === 0 && jesterDead) { gameOver = true; endGame("jester"); return; }
  if (imps.length === 0)               { gameOver = true; endGame("crew");   return; }
  if (imps.length >= crew.length)      { gameOver = true; endGame("impostor"); }
}

function endGame(winner) {
  world?.stop();
  clearInterval(meetingTimerInterval);
  if (chatUnsubscribe) { chatUnsubscribe(); chatUnsubscribe = null; }
  const data = {
    crew:     ["CREW WINS",     "The impostor was ejected. Well played."],
    impostor: ["IMPOSTOR WINS", "Sabotage complete. No survivors."],
    jester:   ["JESTER WINS",   "Voted out on purpose."],
  };
  $("end-title").textContent = data[winner][0];
  $("end-title").style.color = {crew:"var(--accent)",impostor:"var(--danger)",jester:"var(--warn)"}[winner];
  $("end-body").textContent  = data[winner][1];
  show("screen-end");
}

// ── HUD flash helper ──────────────────────────────────────────
function flashHud(msg, type = "info") {
  const lbl = $("room-label");
  lbl.textContent = msg;
  lbl.style.borderColor = type === "warn" ? "var(--warn)" : "var(--muted)";
  lbl.style.color       = type === "warn" ? "var(--warn)" : "var(--muted)";
  lbl.classList.add("visible");
  setTimeout(() => {
    lbl.classList.remove("visible");
    lbl.style.borderColor = "";
    lbl.style.color       = "";
  }, 2500);
}
</script>
